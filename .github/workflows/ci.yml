name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hardening:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:./engine:./connectors
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Production transport and secret guards
        run: python scripts/check_production_guards.py
      - name: Source gateway contract
        run: python scripts/check_gateway_contract.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Existing full smoke test
        run: bash scripts/smoke_test.sh
