      - 'connectors/telegram_bot_legacy.py'
      - 'connectors/telegram_webhook.py'
      - 'connectors/telegram_webhook_runtime.py'
      - 'engine/store.py'
      - 'engine/manager.py'
      - 'engine/proactive.py'
      - 'engine/timing.py'
      - 'connectors/timing_worker.py'
      - 'scripts/aios-timing.sh'
      - 'autostart/cron/**'
      - 'docs/automatic-timing.md'
      - 'engine/telegram_bot.py'
      - 'engine/master_os.py'
      - 'engine/drive_tree.py'
      - 'engine/mindmap.py'
      - 'engine/audio_digest.py'
      - 'engine/scheduler.py'
      - 'engine/unified_inbox.py'
      - 'engine/multi_intent.py'
      - 'tests/test_v09_master_os.py'
      - 'tests/test_v09_mindmap.py'
      - 'tests/test_v09_audio_digest.py'
      - 'tests/test_v09_scheduler.py'
      - 'tests/test_proactive.py'
      - 'tests/test_timing.py'
      - 'tests/test_approve_draft.py'
      - 'engine/approve.py'
      - 'engine/agent_runtime.py'
      - 'engine/research_goals.py'
      - 'tests/test_research_goals.py'
      - 'docs/research-goals.md'
      - 'tests/test_knowledge_privacy.py'
      - 'knowledge/**'
      - 'research_capsules/**'
      - 'tests/test_production_model_gateway.py'
      - 'tests/test_telegram_bot.py'
      - 'tests/test_telegram_response_policy.py'
      - 'tests/test_direct_specialists.py'
      - 'tests/test_provider_diagnostics.py'
      - 'tests/test_team_orchestrator.py'
      - 'tests/test_bedrock_team.py'
      - 'tests/test_lean_missions.py'
      - 'tests/test_ops_context.py'
      - 'tests/test_super_manager.py'
      - 'tests/test_manager_fast_canary.py'
      - 'tests/test_capability_truth.py'
      - 'tests/test_natural_action_executor.py'
      - 'tests/test_executive_signals.py'
      - 'tests/test_commerce_agent.py'
      - 'tests/test_google_context_transport.py'
      - 'tests/test_calendar_actions.py'
      - 'tests/test_calendar_webhook_reminders.py'
      - 'tests/test_mobile_calendar_confirm.py'
      - 'tests/test_task_delegation.py'
      - 'tests/test_state_safety_manager.py'
      - 'tests/test_multi_intent.py'
      - 'tests/test_manager_wo8_compat.py'
      - '.github/workflows/production-model-router.yml'

jobs:
  # Publish guard: runs on every push to main with no path filter, so a direct
  # push (or a file outside the watchlist) cannot skip the contact-data check.
  privacy-guard:
    runs-on: ubuntu-latest
    # يركض على كل push إلى main وعلى أي PR لا يجرّي حزمة الاختبار الكاملة
    # (وظيفة privacy-guard رخيصة: 14 اختبارًا في <1 ثانية).
    if: github.event_name == 'push' || !contains('[main, state-safety-manager-foundation, wo8-linked-multi-intent, feature/super-manager-v1-after-wo8, manager-fast-canary-after-super-manager, capability-truth-action-sync, natural-action-executor-v1]', github.base_ref)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contact-data guard (every tracked file)
        run: python3 -m unittest tests.test_knowledge_privacy
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: DIAGNOSTIC-TEMP remove-after-triage
        shell: bash
        run: |
          set +e
          one() { python -m unittest "$1" 2>&1 | tr '\n' ';' | sed -e 's/%/%25/g' -e 's/:/%3A/g' -e "s/'//g" | cut -c1-240; }
          echo "::error title=py::$(python -V 2>&1) / $(python3 -V 2>&1)"
          echo "::error title=research::$(one tests.test_research_goals)"
          echo "::error title=timing::$(one tests.test_timing)"
          exit 0

      - name: Test production model routing
        run: >-
          python -m unittest
          tests.test_production_model_gateway
          tests.test_telegram_bot
          tests.test_telegram_response_policy
          tests.test_direct_specialists
          tests.test_provider_diagnostics
          tests.test_team_orchestrator
          tests.test_bedrock_team
          tests.test_lean_missions
          tests.test_ops_context
          tests.test_super_manager
          tests.test_manager_fast_canary
          tests.test_capability_truth
          tests.test_natural_action_executor
          tests.test_executive_signals
          tests.test_commerce_agent
          tests.test_google_context_transport
          tests.test_calendar_actions
          tests.test_calendar_webhook_reminders
          tests.test_mobile_calendar_confirm
          tests.test_task_delegation
          tests.test_state_safety_manager
          tests.test_multi_intent
          tests.test_manager_wo8_compat
          tests.test_v09_master_os
          tests.test_v09_mindmap
          tests.test_v09_audio_digest
          tests.test_v09_scheduler
          tests.test_proactive
          tests.test_timing
          tests.test_approve_draft
          tests.test_knowledge_privacy
          tests.test_research_goals
      - name: Check cron wrapper and templates
        run: >-
          bash -n scripts/aios-timing.sh &&
          bash -n autostart/cron/install.sh &&
          bash -n autostart/cron/remove.sh &&
          grep -q '__REPO__' autostart/cron/aios-timing.crontab.template &&
          grep -q 'AIOS-TIMING' autostart/cron/aios-timing.crontab.template &&
          grep -q 'AIOS-TIMING' autostart/cron/aios-timing.timer.template &&
          python3 engine/timing.py install-cron
      - name: Compile production entrypoints
        run: >-
          python -m py_compile
          connectors/model_gateway.py
          connectors/direct_specialists.py
          connectors/provider_diagnostics.py
          connectors/team_orchestrator.py
          connectors/bedrock_team.py
          connectors/lean_missions.py
          connectors/ops_context.py
          connectors/super_manager.py
          connectors/manager_fast_canary.py
          connectors/timing_worker.py
          connectors/capability_truth.py
          connectors/capability_runtime.py
          connectors/action_executor.py
          connectors/action_runtime.py
          connectors/action_deadline_report.py
          connectors/action_language_safety.py
          connectors/executive_signals.py
          connectors/brief_signal_runtime.py
          connectors/brief_discovery.py
          connectors/commerce_agent.py
          connectors/commerce_checkout.py
          connectors/commerce_runtime.py
          connectors/commerce_scout.py
          connectors/commerce_sandbox.py
          connectors/google_credentials.py
          connectors/calendar_actions.py
          connectors/calendar_intent.py
          connectors/mobile_calendar_confirm.py
          connectors/sheet_intelligence.py
          connectors/multi_intent_runtime.py
          connectors/task_delegation.py
          connectors/telegram_bot.py
          connectors/telegram_bot_legacy.py
          connectors/telegram_webhook.py
          connectors/telegram_webhook_runtime.py
          engine/store.py
          engine/manager.py
          engine/proactive.py
          engine/timing.py
          engine/approve.py
          engine/agent_runtime.py
          engine/research_goals.py
          engine/telegram_bot.py
          engine/master_os.py
          engine/drive_tree.py
          engine/mindmap.py
          engine/audio_digest.py
          engine/scheduler.py
          engine/unified_inbox.py
          engine/multi_intent.py
