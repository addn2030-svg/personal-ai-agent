# ============================================================================
# إبقاء خدمة Render المجانية مستيقظة
#
# لماذا: الخطة المجانية في Render تُوقف الخدمة بعد 15 دقيقة بلا حركة واردة،
# وعندها تتوقف محركات الخلفية (الدورة الاستباقية · الجدولة · تذكيرات التقويم)
# ويتأخر استقبال رسائل تيليجرام بسبب الإقلاع البارد (30-60 ثانية).
# هذا الملف ينادي /health من GitHub Actions، فيبقى البوت عاملًا بلا جهاز وسيط
# ولا خدمة ثالثة (وبلا أي سرّ: الرابط ليس سرًّا).
#
# التشغيل (مرة واحدة، نقرتان):
#   المستودع → Settings → Secrets and variables → Actions → Variables →
#   New repository variable → الاسم: RENDER_URL
#   القيمة: https://<اسم-خدمتك>.onrender.com     (بلا / في النهاية)
# قبل ضبط المتغير: كل تشغيل يخرج أخضر ويتخطى العمل بلا خطأ.
#
# ⚠️ حسبة الساعات المجانية (750 ساعة/شهر لكل مساحة عمل):
#   إيقاظ 24/7 يستهلك ~744 ساعة في الشهر الأطول (هامش ~6 ساعات فقط).
#   لذلك الجدولة أدناه تعمل **نهارًا فقط** (05:00-23:00 بتوقيت الرياض = 02:00-20:00 UTC)
#   ≈ 540-558 ساعة شهريًا — هامش آمن، والبوت ينام ليلًا ويعود عند أي رسالة
#   (الإقلاع البارد يعمل، وتيليجرام يعيد المحاولة عند الفشل اللحظي).
#   تريد 24/7؟ اجعل السطر: cron: "*/10 * * * *"
#
# ملاحظة: GitHub يوقف الجدولة في المستودعات الخاملة 60 يومًا — سيصلك تنبيه
# بريدي، ويكفي تشغيل يدوي من تبويب Actions لإعادة تفعيلها (workflow_dispatch).
# ============================================================================
name: keep-warm

on:
  schedule:
    # كل 10 دقائق، من 02:00 إلى 20:20 UTC (05:00-23:20 بتوقيت الرياض)
    - cron: "*/10 2-20 * * *"
  workflow_dispatch: {}   # تشغيل يدوي للتجربة أو لإعادة التفعيل

concurrency:
  group: keep-warm
  cancel-in-progress: false

permissions: {}            # لا يحتاج أي صلاحية على المستودع

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # تخطٍّ واضح قبل إنشاء أي خطوة إن لم يُضبط الرابط بعد
    if: vars.RENDER_URL != ''
    steps:
      - name: Ping /health
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          set -euo pipefail
          url="${RENDER_URL%/}/health"
          echo "Pinging $url"
          # الإقلاع البارد قد يستغرق حتى دقيقة، فالمهلة أطول من المعتاد،
          # والنجاح يعني «ردّ بجسم سليم» لا مجرد فتح اتصال.
          body="$(curl -fsS --max-time 120 --retry 2 --retry-delay 5 "$url")"
          echo "Response: $body"
          case "$body" in
            *'"ok": true'*|*'"ok":true'*) echo "✅ الخدمة مستيقظة" ;;
            *) echo "⚠️ ردّ غير متوقع من /health"; exit 1 ;;
          esac

      - name: Report webhook registration if missing
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          set -euo pipefail
          url="${RENDER_URL%/}/health"
          # خدمة تعمل وwebhook غير مسجَّل = بوت أخرس يبدو سليمًا.
          # نُظهرها في سجل التشغيل بدل أن تُكتشف بعد ساعات.
          if curl -fsS --max-time 60 "$url" | grep -q '"configured": *false'; then
            echo "::warning title=webhook غير مسجَّل::/health يقول إن تسجيل تيليجرام لم ينجح — راجع متغيرات الخدمة في Render (TELEGRAM_BOT_TOKEN و TELEGRAM_WEBHOOK_BASE_URL)."
          fi
