name: Buffer Publish

on:
  workflow_dispatch:
    inputs:
      text:
        description: 'نص المنشور'
        required: true
        type: string
      service:
        description: 'الشبكة الهدف (instagram / twitter / linkedin / facebook ...)'
        required: false
        type: string
      channel_id:
        description: 'معرّف القناة الصريح (يتجاوز service)'
        required: false
        type: string
      mode:
        description: 'queue | draft | schedule'
        required: false
        default: 'queue'
        type: choice
        options: [queue, draft, schedule]
      due_at:
        description: 'عند اختيار schedule: "YYYY-MM-DD HH:MM" بتوقيت السعودية'
        required: false
        type: string
      image_url:
        description: 'رابط الصورة العام (افتراضي: غلاف الكتاب من assets/ في نفس الفرع)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'posts/buffer/**/*.json'

permissions:
  contents: read

concurrency:
  group: buffer-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      TEXT: ${{ inputs.text }}
      SERVICE: ${{ inputs.service }}
      CHANNEL_ID: ${{ inputs.channel_id }}
      MODE: ${{ inputs.mode }}
      DUE_AT: ${{ inputs.due_at }}
      IMAGE_URL: ${{ inputs.image_url || format('https://raw.githubusercontent.com/{0}/{1}/assets/book-cover.jpg', github.repository, github.ref_name) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Publish to Buffer
        run: |
          if [ -z "$BUFFER_API_KEY" ]; then
            echo "::error::BUFFER_API_KEY secret is not configured on this repository."
            exit 1
          fi
          publish_one() {
            local text="$1" service="$2" channel_id="$3" mode="$4" due_at="$5" image_url="$6"
            ARGS=(--text "$text")
            [ -n "$image_url" ] && ARGS+=(--image-url "$image_url")
            if [ -n "$channel_id" ]; then
              ARGS+=(--channel-id "$channel_id")
            elif [ -n "$service" ]; then
              ARGS+=(--service "$service")
            else
              echo "::error::Provide either service or channel_id."
              return 1
            fi
            case "$mode" in
              draft) ARGS+=(--draft) ;;
              schedule)
                [ -n "$due_at" ] || { echo "::error::schedule mode requires due_at."; return 1; }
                ARGS+=(--due-at "$due_at") ;;
              queue|"") ;;
              *) echo "::error::Unknown mode: $mode"; return 1 ;;
            esac
            python3 -m connectors.buffer_publisher "${ARGS[@]}"
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            publish_one "$TEXT" "$SERVICE" "$CHANNEL_ID" "$MODE" "$DUE_AT" "$IMAGE_URL"
          else
            mapfile -t FILES < <(git diff --name-only --diff-filter=AM HEAD^ HEAD -- 'posts/buffer/**/*.json')
            [ "${#FILES[@]}" -gt 0 ] || { echo "::error::No new or changed JSON payload found."; exit 1; }
            for FILE in "${FILES[@]}"; do
              jq -e '.text and (.service or .channel_id)' "$FILE" >/dev/null
              publish_one \
                "$(jq -r '.text' "$FILE")" \
                "$(jq -r '.service // ""' "$FILE")" \
                "$(jq -r '.channel_id // ""' "$FILE")" \
                "$(jq -r '.mode // "queue"' "$FILE")" \
                "$(jq -r '.due_at // ""' "$FILE")" \
                "$(jq -r '.image_url // ""' "$FILE")"
            done
          fi
