name: Production Model Router

on:
  pull_request:
    branches: [main]
    paths:
      - 'connectors/model_gateway.py'
      - 'connectors/direct_specialists.py'
      - 'connectors/provider_diagnostics.py'
      - 'connectors/team_orchestrator.py'
      - 'connectors/__init__.py'
      - 'connectors/task_delegation.py'
      - 'connectors/telegram_bot.py'
      - 'connectors/telegram_bot_legacy.py'
      - 'tests/test_production_model_gateway.py'
      - 'tests/test_direct_specialists.py'
      - 'tests/test_provider_diagnostics.py'
      - 'tests/test_team_orchestrator.py'
      - 'tests/test_task_delegation.py'
      - '.github/workflows/production-model-router.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test production model routing
        run: python -m unittest tests.test_production_model_gateway tests.test_direct_specialists tests.test_provider_diagnostics tests.test_team_orchestrator tests.test_task_delegation
      - name: Compile production entrypoints
        run: python -m py_compile connectors/model_gateway.py connectors/direct_specialists.py connectors/provider_diagnostics.py connectors/team_orchestrator.py connectors/task_delegation.py connectors/telegram_bot.py connectors/telegram_bot_legacy.py
