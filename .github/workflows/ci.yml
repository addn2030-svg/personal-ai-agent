name: CI
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: بوابة الأسرار
        run: python scripts/secret_guard.py
      - name: بوابة جودة PR (حجم/حذف/ملفات محمية)
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          python scripts/pr_check.py --base "$BASE" --head HEAD
  smoke:
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: تثبيت الاعتمادية الوحيدة
        run: pip install openpyxl
      - name: بناء بيئة تجريبية واختبار دخان كامل
        run: bash scripts/smoke_test.sh
