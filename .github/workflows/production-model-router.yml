name: Production Model Router

on:
  pull_request:
    branches: [main]
    paths:
      - 'connectors/__init__.py'
      - 'connectors/model_gateway.py'
      - 'connectors/task_delegation.py'
      - 'connectors/google_knowledge.py'
      - 'connectors/google_knowledge_webhook.py'
      - 'connectors/google_sheets_webhook.gs'
      - 'connectors/telegram_bot.py'
      - 'connectors/telegram_bot_legacy.py'
      - 'tests/test_production_model_gateway.py'
      - 'tests/test_task_delegation.py'
      - 'tests/test_google_knowledge.py'
      - 'tests/test_google_knowledge_webhook.py'
      - '.github/workflows/production-model-router.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test production model routing and knowledge access
        run: python -m unittest tests.test_production_model_gateway tests.test_task_delegation tests.test_google_knowledge tests.test_google_knowledge_webhook
      - name: Compile production entrypoints
        run: python -m py_compile connectors/model_gateway.py connectors/task_delegation.py connectors/google_knowledge.py connectors/google_knowledge_webhook.py connectors/telegram_bot.py connectors/telegram_bot_legacy.py
