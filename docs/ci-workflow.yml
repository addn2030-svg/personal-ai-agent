name: CI
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: تثبيت الاعتمادية الوحيدة
        run: pip install openpyxl
      - name: بناء بيئة تجريبية واختبار دخان كامل
        run: bash scripts/smoke_test.sh
