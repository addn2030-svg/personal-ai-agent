<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المدير الشخصي — Level 2</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#2d333b; --text:#e6edf3;
    --muted:#8b949e; --accent:#3fb950; --accent2:#58a6ff; --warn:#d29922; --danger:#f85149;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"Segoe UI","Noto Kufi Arabic",Tahoma,sans-serif;height:100vh;display:flex;overflow:hidden}
  /* ── الشريط الجانبي ── */
  aside{width:300px;min-width:300px;background:var(--panel);border-left:1px solid var(--line);padding:18px;overflow-y:auto}
  aside h1{font-size:17px;margin-bottom:4px}
  aside .sub{color:var(--muted);font-size:12px;margin-bottom:16px}
  .brief-box{background:#1c2129;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px;font-size:13px;line-height:1.7}
  .brief-box b{color:var(--accent2)}
  .warn{color:var(--warn)}
  .quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .quick button{background:#21262d;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;cursor:pointer;font-family:inherit}
  .quick button:hover{border-color:var(--accent2)}
  .controls{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);margin-top:8px}
  .controls label{display:flex;gap:5px;align-items:center;cursor:pointer}
  /* ── المحادثة ── */
  main{flex:1;display:flex;flex-direction:column}
  #chat{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:72%;padding:12px 16px;border-radius:14px;line-height:1.8;font-size:14px;white-space:pre-wrap}
  .user{align-self:flex-start;background:#1f3a5f;border:1px solid #264a78}
  .agent{align-self:flex-end;background:#1b2b20;border:1px solid #24512f}
  .msg .tag{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}
  /* ── شريط الإدخال ── */
  footer{border-top:1px solid var(--line);padding:14px 22px;display:flex;gap:10px;align-items:center;background:var(--panel)}
  #mic{width:58px;height:58px;border-radius:50%;border:2px solid var(--accent);background:#12261a;color:var(--accent);font-size:24px;cursor:pointer;flex-shrink:0;transition:all .2s}
  #mic.rec{background:var(--danger);border-color:var(--danger);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(248,81,73,.5)}50%{box-shadow:0 0 0 14px rgba(248,81,73,0)}}
  #mic:disabled{opacity:.4;cursor:not-allowed}
  #txt{flex:1;background:#0d1117;border:1px solid var(--line);border-radius:24px;color:var(--text);padding:13px 18px;font-size:14px;font-family:inherit}
  #txt:focus{outline:none;border-color:var(--accent2)}
  #send{background:var(--accent);color:#04140a;border:none;border-radius:20px;padding:11px 20px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
  #status{width:100%;text-align:center;font-size:11px;color:var(--muted);margin-top:6px;min-height:14px}
  @media(max-width:720px){aside{display:none}}
</style>
</head>
<body>

<aside>
  <h1>🎙️ المدير الشخصي</h1>
  <div class="sub">Level 2 — حوار حي + استشارة · محلي 100%</div>

  <div class="brief-box" id="brief">جاري تحميل البريف…</div>

  <div class="quick">
    <button data-q="بريف">☀️ بريف</button>
    <button data-q="مهامي">📋 مهامي</button>
    <button data-q="مراجعة أسبوعية">📊 مراجعة</button>
    <button data-q="طاقتي الآن؟">🔋 طاقتي</button>
    <button data-q="الانتظار">⏳ الانتظار</button>
    <button data-q="حالة النظام">🩺 الحالة</button>
    <button data-q="مساعدة">❓ مساعدة</button>
  </div>

  <div class="controls">
    <label><input type="checkbox" id="tts" checked> 🔊 رد صوتي</label>
    <label><input type="checkbox" id="stt-ar" checked> 🇸🇦 عربي</label>
  </div>
  <div class="controls" style="margin-top:4px">
    <span>العقل: <b id="brain">—</b></span>
  </div>
</aside>

<main>
  <div id="chat"></div>
  <footer>
    <button id="mic" title="تحدث (اضغط للتسجيل)">🎙️</button>
    <input id="txt" placeholder="اكتب هنا أو اضغط المايك وتحدث…" autocomplete="off">
    <button id="send">إرسال</button>
    <div id="status"></div>
  </footer>
</main>

<script>
const chat = document.getElementById('chat');
const txt  = document.getElementById('txt');
const mic  = document.getElementById('mic');
const statusEl = document.getElementById('status');

let session = null;
let recognizing = false;

// ── تحميل البريف والحالة ──
async function loadBrief(){
  try{
    const r = await fetch('/api/brief'); const d = await r.json();
    const b = d.brief;
    let html = '<b>☀️ بريف ' + b.date + '</b><br>';
    if (b.priorities && b.priorities.length){
      html += '<b>الأولويات:</b><br>' + b.priorities.map(t=>'• '+t.title+(t.due?' (قبل '+t.due+')':'')).join('<br>') + '<br>';
    } else { html += 'لا مهام مفتوحة<br>'; }
    html += 'قرارات معلقة: <b>' + b.decisions_pending + '</b> · مهام مفتوحة: <b>' + b.tasks_open + '</b>';
    if (b.tasks_overdue) html += ' <span class="warn">· متأخرة: ' + b.tasks_overdue + ' ⚠️</span>';
    if (b.last_energy) html += '<br>آخر طاقة: <b>' + b.last_energy.energy + '/10</b>';
    document.getElementById('brief').innerHTML = html;
  }catch(e){ document.getElementById('brief').textContent = 'تعذر تحميل البريف'; }
}
async function loadStatus(){
  try{
    const r = await fetch('/api/status'); const d = await r.json();
    document.getElementById('brain').textContent = d.llm.mode === 'LLM' ? ('نموذج: '+d.llm.model) : 'حتمي محلي';
  }catch(e){}
}
loadBrief(); loadStatus();

// ── عرض الرسائل ──
function addMsg(text, who, intent){
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  el.innerHTML = '<span class="tag">' + (who==='user'?'أنت':'المدير'+(intent?' · '+intent:'')) + '</span>';
  el.appendChild(document.createTextNode(text));
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

// ── النطق (TTS) ──
function speak(text){
  if (!document.getElementById('tts').checked) return;
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[•⚡⚖️🔋⚠️🎯📌💬🧘📊⏳🩺❓☀️📋]/g,''));
  const ar = document.getElementById('stt-ar').checked;
  u.lang = ar ? 'ar-SA' : 'en-US';
  const voices = speechSynthesis.getVoices();
  const v = voices.find(v=>v.lang && v.lang.startsWith(ar?'ar':'en'));
  if (v) u.voice = v;
  u.rate = 1.0;
  speechSynthesis.speak(u);
}

// ── إرسال ──
async function send(text){
  text = (text||'').trim();
  if (!text) return;
  addMsg(text, 'user');
  txt.value = ''; statusEl.textContent = 'المدير يفكر…';
  try{
    const r = await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text, session, channel:'web'})
    });
    const d = await r.json();
    session = d.session || session;
    addMsg(d.reply, 'agent', d.intent);
    speak(d.reply);
    statusEl.textContent = 'وضع: ' + (d.mode==='llm'?'نموذج لغوي':'حتمي محلي');
    loadBrief();
  }catch(e){
    addMsg('تعذر الاتصال بالخادم — تأكد أن python3 -m level2.server يعمل.', 'agent');
    statusEl.textContent = '';
  }
}
document.getElementById('send').onclick = ()=>send(txt.value);
txt.addEventListener('keydown', e=>{ if(e.key==='Enter') send(txt.value); });
document.querySelectorAll('.quick button').forEach(b=>{
  b.onclick = ()=>send(b.dataset.q);
});

// ── التعرف على الكلام (STT) — Web Speech API ──
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR){
  mic.disabled = true;
  statusEl.textContent = 'التعرف الصوتي غير متاح في هذا المتصفح — استخدم Chrome/Edge أو اكتب.';
} else {
  const rec = new SR();
  rec.continuous = false;
  rec.interimResults = false;
  rec.lang = 'ar-SA';
  document.getElementById('stt-ar').onchange = function(){
    rec.lang = this.checked ? 'ar-SA' : 'en-US';
  };
  rec.onstart = ()=>{ recognizing = true; mic.classList.add('rec'); statusEl.textContent = 'أسمعك… تكلم'; };
  rec.onend   = ()=>{ recognizing = false; mic.classList.remove('rec'); statusEl.textContent=''; };
  rec.onerror = (e)=>{ recognizing = false; mic.classList.remove('rec');
    statusEl.textContent = 'خطأ مايك: ' + e.error; };
  rec.onresult = (e)=>{
    const text = e.results[0][0].transcript;
    send(text);
  };
  mic.onclick = ()=>{
    if (recognizing){ rec.stop(); return; }
    try{ rec.start(); }catch(e){}
  };
}

// ترحيب أول
addMsg('أهلاً عبدالرحمن 👋 — أنا مديرك الشخصي (Level 2): أتكلم معك وأستشيرك حسب بروتوكولاتك.\nاضغط 🎙️ وتحدث، أو اكتب. جرّب: «بريف» أو «قرار: ...» أو «أعاني من التسويف».', 'agent');
</script>
</body>
</html>
